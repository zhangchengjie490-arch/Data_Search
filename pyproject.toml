[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetybench-agent"
version = "0.1.0"
description = "持续发现、分类和发布 Hugging Face AI 安全测评基准的可审计 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "fsspec>=2023.5.0",
  "huggingface-hub>=0.28",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pyarrow>=16",
  "pydantic>=2.7",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
safetybench-agent = "safetybench_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
